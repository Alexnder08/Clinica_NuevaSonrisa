<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .bg { fill: #f8fafb; }
      .title { font: 700 32px Arial, sans-serif; fill: #143642; }
      .axis { stroke: #395b64; stroke-width: 3; }
      .grid { stroke: #d5e4e8; stroke-width: 1.5; }
      .label { font: 700 16px Arial, sans-serif; fill: #17343f; }
      .small { font: 400 13px Arial, sans-serif; fill: #405a64; }
      .bubble { stroke: #ffffff; stroke-width: 3; }
      .btext { font: 700 13px Arial, sans-serif; fill: #102a33; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="58" class="title">Matriz de criticidad de activos</text>
  <text x="60" y="88" class="small">Eje horizontal: impacto si falla o se filtra. Eje vertical: sensibilidad de la informacion.</text>

  <line x1="170" y1="610" x2="1040" y2="610" class="axis"/>
  <line x1="170" y1="610" x2="170" y2="125" class="axis"/>
  <line x1="460" y1="125" x2="460" y2="610" class="grid"/>
  <line x1="750" y1="125" x2="750" y2="610" class="grid"/>
  <line x1="170" y1="448" x2="1040" y2="448" class="grid"/>
  <line x1="170" y1="286" x2="1040" y2="286" class="grid"/>

  <text x="300" y="650" class="label">Impacto bajo</text>
  <text x="580" y="650" class="label">Impacto medio</text>
  <text x="855" y="650" class="label">Impacto alto</text>
  <text x="60" y="525" class="label">Sensibilidad baja</text>
  <text x="45" y="365" class="label">Sensibilidad media</text>
  <text x="55" y="205" class="label">Sensibilidad alta</text>

  <circle cx="915" cy="180" r="58" fill="#ff8787" class="bubble"/>
  <text x="915" y="176" class="btext">BD PostgreSQL</text>
  <text x="915" y="195" class="btext">Supabase</text>

  <circle cx="875" cy="285" r="52" fill="#ffa8a8" class="bubble"/>
  <text x="875" y="282" class="btext">Pacientes y</text>
  <text x="875" y="301" class="btext">datos clinicos</text>

  <circle cx="965" cy="375" r="48" fill="#ffc9c9" class="bubble"/>
  <text x="965" y="372" class="btext">Adjuntos</text>
  <text x="965" y="391" class="btext">clinicos</text>

  <circle cx="720" cy="210" r="49" fill="#ffd43b" class="bubble"/>
  <text x="720" y="207" class="btext">Credenciales</text>
  <text x="720" y="226" class="btext">y secretos</text>

  <circle cx="690" cy="335" r="46" fill="#91d5ff" class="bubble"/>
  <text x="690" y="332" class="btext">Usuarios, roles</text>
  <text x="690" y="351" class="btext">y sesion</text>

  <circle cx="595" cy="430" r="43" fill="#a5d8ff" class="bubble"/>
  <text x="595" y="427" class="btext">Citas</text>
  <text x="595" y="446" class="btext">y agenda</text>

  <circle cx="515" cy="500" r="40" fill="#b2f2bb" class="bubble"/>
  <text x="515" y="497" class="btext">Odontologos</text>
  <text x="515" y="516" class="btext">y servicios</text>

  <circle cx="760" cy="500" r="42" fill="#ffd8a8" class="bubble"/>
  <text x="760" y="497" class="btext">Backups</text>
  <text x="760" y="516" class="btext">y reportes</text>

  <circle cx="455" cy="365" r="39" fill="#d0bfff" class="bubble"/>
  <text x="455" y="362" class="btext">Correo</text>
  <text x="455" y="381" class="btext">externo</text>
</svg>
