<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #143642; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #43616c; }
      .box { fill: #ffffff; stroke: #b8d8df; stroke-width: 2; rx: 14; }
      .core { fill: #e8f7fa; stroke: #2b9ab3; stroke-width: 3; rx: 18; }
      .risk { fill: #fff4e6; stroke: #f59f00; stroke-width: 2; rx: 14; }
      .critical { fill: #ffe3e3; stroke: #fa5252; stroke-width: 2; rx: 14; }
      .text { font: 700 18px Arial, sans-serif; fill: #16343f; }
      .small { font: 400 13px Arial, sans-serif; fill: #405a64; }
      .tag { font: 700 12px Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #5c7c89; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#5c7c89"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text x="60" y="58" class="title">Mapa de activos criticos - Nueva Sonrisa</text>
  <text x="60" y="86" class="subtitle">Activos que sostienen confidencialidad, integridad y disponibilidad del sistema odontologico.</text>

  <rect x="455" y="285" width="290" height="145" class="core"/>
  <text x="500" y="330" class="text">Base de datos PostgreSQL</text>
  <text x="505" y="360" class="small">Supabase: fuente principal</text>
  <text x="505" y="382" class="small">pacientes, citas, usuarios,</text>
  <text x="505" y="404" class="small">adjuntos, auditoria y accesos</text>

  <rect x="70" y="150" width="250" height="115" class="critical"/>
  <text x="105" y="188" class="text">Credenciales y secretos</text>
  <text x="105" y="218" class="small">DATABASE_URL, usuario, password,</text>
  <text x="105" y="240" class="small">RESEND_API_KEY, SMTP_PASS</text>

  <rect x="70" y="325" width="250" height="115" class="box"/>
  <text x="112" y="363" class="text">Usuarios, roles y sesion</text>
  <text x="105" y="393" class="small">Administrador, Recepcion, Doctor</text>
  <text x="105" y="415" class="small">autenticacion BCrypt y permisos</text>

  <rect x="70" y="500" width="250" height="115" class="critical"/>
  <text x="105" y="538" class="text">Pacientes y datos clinicos</text>
  <text x="105" y="568" class="small">DNI, contacto, historial, notas</text>
  <text x="105" y="590" class="small">informacion sensible de salud</text>

  <rect x="475" y="105" width="250" height="115" class="box"/>
  <text x="520" y="143" class="text">Citas y agenda</text>
  <text x="510" y="173" class="small">reservas, estados, asistencia,</text>
  <text x="510" y="195" class="small">reprogramaciones y calendario</text>

  <rect x="875" y="150" width="250" height="115" class="box"/>
  <text x="905" y="188" class="text">Odontologos y servicios</text>
  <text x="910" y="218" class="small">horarios, especialidades,</text>
  <text x="910" y="240" class="small">tratamientos y disponibilidad</text>

  <rect x="875" y="325" width="250" height="115" class="critical"/>
  <text x="925" y="363" class="text">Adjuntos de citas</text>
  <text x="910" y="393" class="small">PDF, imagenes y Word hasta 10 MB</text>
  <text x="910" y="415" class="small">almacenados en PostgreSQL</text>

  <rect x="875" y="500" width="250" height="115" class="risk"/>
  <text x="930" y="538" class="text">Backups y reportes</text>
  <text x="910" y="568" class="small">.backup, PDF, Excel, impresion</text>
  <text x="910" y="590" class="small">contienen datos operativos</text>

  <rect x="475" y="555" width="250" height="115" class="risk"/>
  <text x="535" y="593" class="text">Correo externo</text>
  <text x="510" y="623" class="small">Resend / SMTP para confirmacion,</text>
  <text x="510" y="645" class="small">recordatorios y recuperacion</text>

  <path d="M320 207 C385 225 420 282 455 330" class="arrow"/>
  <path d="M320 382 C380 380 420 370 455 360" class="arrow"/>
  <path d="M320 557 C385 520 420 430 455 390" class="arrow"/>
  <path d="M600 220 L600 285" class="arrow"/>
  <path d="M875 207 C810 225 780 282 745 330" class="arrow"/>
  <path d="M875 382 L745 382" class="arrow"/>
  <path d="M875 557 C810 515 780 432 745 400" class="arrow"/>
  <path d="M600 555 L600 430" class="arrow"/>

  <rect x="60" y="690" width="18" height="18" fill="#ffe3e3" stroke="#fa5252"/>
  <text x="88" y="704" class="small">Critico alto: informacion sensible, secretos o recuperacion operacional</text>
  <rect x="470" y="690" width="18" height="18" fill="#fff4e6" stroke="#f59f00"/>
  <text x="498" y="704" class="small">Critico medio-alto: soporte operativo y continuidad</text>
  <rect x="800" y="690" width="18" height="18" fill="#ffffff" stroke="#b8d8df"/>
  <text x="828" y="704" class="small">Critico funcional: necesario para el flujo diario</text>
</svg>
